syntax = "proto3";

package pmqueue;

// 消息类型枚举
enum MessageType {
    UNKNOWN = 0;
    PUBLISH = 1;       // 发布消息
    SUBSCRIBE = 2;     // 订阅主题
    UNSUBSCRIBE = 3;   // 取消订阅
    PULL = 4;          // 拉取消息
    ACK = 5;           // 确认消费
    RESPONSE = 6;      // 通用响应
    PUSH = 7;          // 服务端推送
    PULL_DLQ = 8;      // 拉取死信队列
    BATCH_PUBLISH = 9; // 批量发布
    BATCH_PUSH = 10;   // 批量推送
    PING = 11;         // 心跳请求
    PONG = 12;         // 心跳响应
}

// 发布消息
message PublishRequest {
    string topic = 1;
    bytes payload = 2;
    uint32 ttl_ms = 3; // 消息存活时间，0 表示永不过期
    bool compressed = 4; // payload 是否已压缩
    string producer_id = 5; // 生产者唯一标识（用于去重）
    uint64 sequence_id = 6; // 生产者单调递增序列号（用于去重）
}

// 批量发布消息
message BatchPublishRequest {
    repeated PublishRequest messages = 1;
}

// 批量推送消息（服务端 -> 客户端）
message BatchPushMessage {
    repeated PushMessage messages = 1;
}

// 订阅请求
message SubscribeRequest {
    string topic = 1;
    string subscriber_id = 2;
    string group_id = 3;       // 消费者组 ID，为空表示独立消费者（广播模式）
}

// 取消订阅请求
message UnsubscribeRequest {
    string topic = 1;
    string subscriber_id = 2;
    string group_id = 3;
}

// 拉取消息请求
message PullRequest {
    string topic = 1;
    string subscriber_id = 2;
    string group_id = 3;       // 消费者组 ID，为空表示独立消费者
    uint32 max_messages = 4;
}

// 确认消费
message AckRequest {
    string topic = 1;
    string subscriber_id = 2;
    string group_id = 3;       // 消费者组 ID
    uint64 message_id = 4;
}

// 通用响应
message Response {
    bool success = 1;
    string error_msg = 2;
    uint64 message_id = 3;
}

// 推送消息（服务端 -> 客户端）
message PushMessage {
    uint64 message_id = 1;
    string topic = 2;
    bytes payload = 3;
    uint64 timestamp = 4;
    uint32 retry_count = 5;    // 当前重试次数，0 表示首次投递
    bool compressed = 6;       // payload 是否已压缩
}

// 通用消息包装
message Message {
    MessageType type = 1;
    oneof body {
        PublishRequest publish = 2;
        SubscribeRequest subscribe = 3;
        UnsubscribeRequest unsubscribe = 4;
        PullRequest pull = 5;
        AckRequest ack = 6;
        Response response = 7;
        PushMessage push = 8;
        BatchPublishRequest batch_publish = 9;
        BatchPushMessage batch_push = 10;
    }
}
